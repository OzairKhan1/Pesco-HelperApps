version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ps_postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_net

  web:
    image: ozairkhan1/pescoencoder:v1.1
    container_name: pescoencoder_app
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    expose:
      - "5000"   # internal only
    networks:
      - app_net

  nginx:
    image: nginx:alpine
    container_name: pesco_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net

volumes:
  pgdata:

networks:
  app_net:
    driver: bridge

